name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 in Nov 2026; bump deliberately after testing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate skills
        run: python scripts/validate.py
